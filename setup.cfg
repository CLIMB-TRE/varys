[metadata]
name = varys-client
version = 1.3.0
author = Sam Wilkinson, Jess Friedersdorff
author_email = s.a.j.wilkinson@bham.ac.uk, jess.friedersdorff@ukhsa.gov.uk
description = A pika-based python RabbitMQ client for use in the CLIMB-GRE project
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/climb-tre/varys
license_files =  LICENSE
license = GNU GPLv3
classifiers =
    Programming Language :: Python :: 3

[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.7
install_requires =
    pika>=1.3.0
    setuptools>=42

[tool:pytest]
testpaths = tests
addopts = --strict-markers
markers =
    broker: requires a running RabbitMQ broker
    tls: requires the broker's TLS listener on 5671
    permissions: requires the guest2 user from .rabbitmq/definitions.json